site_name: podrank
site_description: Rating fixed, versioned agents in four-player free-for-all games
docs_dir: docs
theme:
  name: material
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
nav:
  - Home: index.md
  - Concepts:
      - Ratings and fields: concepts/ratings.md
      - Identification: concepts/identification.md
      - Uncertainty: concepts/uncertainty.md
  - Assumptions: assumptions.md
  - How-to:
      - Fit from logs: how-to/fit-from-logs.md
      - Define a field: how-to/define-a-field.md
      - Run a comparison: how-to/run-a-comparison.md
  - Reference:
      - Overview: reference/index.md
      - podrank.data: reference/data.md
      - podrank.rating: reference/rating.md
      - podrank.uncertainty: reference/uncertainty.md
      - podrank.sim: reference/sim.md
      - podrank.errors: reference/errors.md
      - podrank.compare: reference/compare.md
  - Glossary: glossary.md
  - Limitations: limitations.md
  - Decisions:
      - Overview: decisions/index.md
      - ADR template: decisions/0000-template.md
      - P1 data surfaces: decisions/0001-p1-data-surfaces.md
      - P2 performance spike: decisions/0002-p2-performance-spike.md
      - Posterior archive: decisions/0003-posterior-archive.md
      - Bootstrap workers: decisions/0004-bootstrap-workers.md
      - SC4 generator: decisions/0005-sc4-generator.md
      - SC1/SC2 ci_smoke results: decisions/0006-sc1-sc2-ci-smoke.md
      - Batched bootstrap SDWP: decisions/0007-batched-bootstrap-sdwp.md
      - Vectorised setup and compression: decisions/0008-vectorised-setup-and-compression.md
      - Prediction, ingestion and study parallelism: decisions/0009-prediction-ingestion-and-study-parallelism.md
      - Standard SC2 result: decisions/0010-standard-sc2-result.md
      - Drop Windows support: decisions/0011-drop-windows-support.md
      - Reduced S5/S11 run: decisions/0012-reduced-s5-s11.md
      - Full S5/S11 run: decisions/0013-full-s5-s11.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
