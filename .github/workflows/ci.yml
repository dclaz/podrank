name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install ${{ matrix.python-version }}

      - run: uv sync --locked --group dev --python ${{ matrix.python-version }}

      - run: uv run --locked --python ${{ matrix.python-version }} ruff check .

      - run: uv run --locked --python ${{ matrix.python-version }} ruff format --check .

      - run: uv run --locked --python ${{ matrix.python-version }} mypy --strict -p podrank

      - run: uv run --locked --python ${{ matrix.python-version }} coverage run -m pytest -q -m 'not stat'

      - run: uv run --locked --python ${{ matrix.python-version }} coverage report

      - run: uv run --locked --python ${{ matrix.python-version }} mkdocs build --strict

  windows-smoke:
    name: Windows smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install 3.12

      - run: uv sync --locked --group dev --python 3.12

      - run: uv run --locked --python 3.12 pytest -q tests/test_smoke.py

      - run: uv run --locked --python 3.12 pytest -q tests/test_bootstrap.py -k "spawn or serial_parallel"
